<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TripYatra</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('./Assets/bg-login.jpg') no-repeat center center/cover;
      position: relative;
      overflow: hidden;
    }

    /* Overlay for darker effect */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(26, 41, 128, 0.7);
      z-index: 1;
    }

    /* Floating decorative shapes */
    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      animation: float 6s ease-in-out infinite;
      z-index: 0;
    }

    .shape1 { width: 120px; height: 120px; top: 10%; left: 5%; }
    .shape2 { width: 80px; height: 80px; top: 70%; left: 20%; animation-delay: 2s; }
    .shape3 { width: 150px; height: 150px; top: 50%; left: 75%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg);}
      50% { transform: translateY(-20px) rotate(15deg);}
    }

    /* Navbar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: linear-gradient(90deg, #1a2980, #26d0ce);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    #logo {
      height: 50px;
      width: 50px;
      border-radius: 50%;
      margin-right: 10px;
      transition: transform 0.3s;
    }

    #logo:hover { transform: rotate(15deg); }

    .site-name {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .nav-links a:hover {
      color: #ffdd57;
      transform: scale(1.05);
    }

    @media (max-width:768px) {
      nav { flex-direction: column; padding: 20px;}
      .nav-links { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; }
      .nav-links a { margin: 10px 15px; }
    }

    /* Login Container */
    .login-container {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.1);
      padding: 50px 40px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      width: 350px;
      text-align: center;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .login-container h2 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .login-container label {
      display: block;
      color: #fff;
      text-align: left;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .login-container input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: none;
      margin-bottom: 20px;
      font-size: 15px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      transition: all 0.3s ease;
    }

    .login-container input::placeholder { color: #ddd; }
    .login-container input:focus {
      outline: none;
      background: rgba(255,255,255,0.3);
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    /* Animated Gradient Button */
    .login-container button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, #ffdd57, #ffc107);
      color: #000;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .login-container button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.3), rgba(255,255,255,0));
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .login-container button:hover::after { transform: translateX(100%); }
    .login-container button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .login-container .links {
      margin-top: 15px;
      font-size: 14px;
    }

    .login-container .links a {
      color: #fff;
      text-decoration: none;
      margin: 0 6px;
      transition: all 0.3s ease;
    }

    .login-container .links a:hover {
      color: #ffdd57;
      text-decoration: underline;
    }

    @media(max-width: 400px) {
      .login-container { width: 90%; padding: 40px 25px; }
      .login-container h2 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- Floating Shapes -->
  <div class="shape shape1"></div>
  <div class="shape shape2"></div>
  <div class="shape shape3"></div>

  <!-- Navbar -->
  <nav>
    <div class="brand">
      <img src="./Assets/logo.jpg" alt="TripYatra Logo" id="logo">
      <span class="site-name">TripYatra</span>
    </div>
    <div class="nav-links">
      <a href="./Home.html">Home</a>
      <a href="./Destination.html">Destination</a>
      <a href="./Packages.html">Packages</a>
      <a href="./Gallery.html">Gallery</a>
      <a href="./Contact.html">Contact</a>
      <a href="./Login.html">Login</a>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="login-container">
    <h2>Welcome Back!</h2>
    <form action="#">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit">Login</button>

      <div class="links">
        <a href="./forgetpassword.html">Forgot Password?</a> |
        <a href="./createaccount.html">Create Account</a>
      </div>
    </form>
  </div>

</body>
</html>
